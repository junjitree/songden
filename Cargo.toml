[package]
name = "songden"
version = "0.1.0"
edition = "2024"
description = "A self-hosted, kid-safe music player inspired by Yoto and Toniebox"
repository = "https://github.com/junjitree/songden"
readme = "README.md"
publish = false

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
cookie = "0.18"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "stream", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

[profile.release]
strip = true
